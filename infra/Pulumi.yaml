name: k8lh
description: A minimal Kubernetes Python Pulumi program
runtime:
  name: python
  options:
    toolchain: uv
config:
  pulumi:tags:
    value:
      pulumi:template: kubernetes-python
  k8lh:domain:
    description: Domain for ingress hosts (e.g., k8lh.local)
  k8lh:node:
    description: Kubernetes node hostname for pod scheduling
  k8lh:minio_root_user:
    description: MinIO root username
  k8lh:minio_root_password:
    description: MinIO root password
    secret: true
