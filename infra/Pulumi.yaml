name: k8lh
description: A minimal Kubernetes Python Pulumi program
runtime:
  name: python
  options:
    toolchain: uv
    virtualenv: .venv
config:
  pulumi:tags:
    value:
      pulumi:template: kubernetes-python
  k8lh:domain:
    description: Domain for ingress hosts (e.g., k8lh.local)
    value: k8lh.local
  k8lh:minio_root_user:
    description: MinIO root username
    value: minioadmin
  k8lh:minio_root_password:
    description: MinIO root password
    secret: true
  k8lh:postgres_admin_user:
    description: PostgreSQL admin username
    value: postgres
  k8lh:postgres_admin_password:
    description: PostgreSQL admin password
    secret: true
  k8lh:airflow_postgres_user:
    description: PostgreSQL Airflow username
    value: airflow
  k8lh:airflow_postgres_password:
    description: PostgreSQL Airflow password
    secret: true
  k8lh:airflow_admin_password:
    description: Airflow admin UI password
    secret: true
  k8lh:airflow_fernet_key:
    description: Fernet key for Airflow connection/variable encryption
    secret: true
  k8lh:airflow_webserver_secret_key:
    description: Flask session signing key for the Airflow webserver
    secret: true
  k8lh:airflow_git_repo:
    value: https://github.com/MRehd/kube-lakehouse.git
    description: HTTPS URL of the git repo containing Airflow DAGs (e.g. https://github.com/org/repo.git)
  k8lh:airflow_git_token:
    description: GitHub Personal Access Token for git-sync to pull from the DAGs repo
    secret: true
  k8lh:airflow_git_branch:
    value: master
  k8lh:polaris_postgres_user:
    description: PostgreSQL Polaris username
    value: polaris
  k8lh:polaris_postgres_password:
    description: PostgreSQL Polaris password
    secret: true
  k8lh:docker_registry_username:
    description: Docker registry username for pushing the producer image
    value: ""
  k8lh:docker_registry_password:
    description: Docker registry password or access token
    secret: true
    value: ""
  k8lh:docker_producer_image_name:
    description: Full image name without tag, e.g. localhost:5000/producer or docker.io/myuser/producer
    value: "localhost:5000/producer"
  k8lh:docker_mcp_image_name:
    description: Full image name without tag, e.g. localhost:5000/mcp or docker.io/myuser/mcp
    value: "localhost:5000/mcp"
  k8lh:docker_spark_image_name:
    description: Full image name without tag, e.g. localhost:5000/spark or docker.io/myuser/spark
    value: "localhost:5000/spark"
  k8lh:docker_airflow_image_name:
    description: Full image name without tag, e.g. localhost:5000/spark or docker.io/myuser/airflow
    value: "localhost:5000/airflow"
  k8lh:docker_flink_jobs_image_name:
    description: Full image name without tag, e.g. localhost:5000/flink-jobs or docker.io/myuser/flink-jobs
    value: "localhost:5000/flink-jobs"
  k8lh:s3_region:
    description: S3/MinIO region (used for Iceberg catalog and Flink S3 config)
    value: "us-east-1"
