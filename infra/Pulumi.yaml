name: k8lh
description: A minimal Kubernetes Python Pulumi program
runtime:
  name: python
  options:
    toolchain: uv
    virtualenv: ../.venv
config:
  pulumi:tags:
    value:
      pulumi:template: kubernetes-python
  k8lh:domain:
    description: Domain for ingress hosts (e.g., k8lh.local)
  k8lh:node:
    description: Kubernetes node hostname for pod scheduling
  k8lh:minio_root_user:
    description: MinIO root username
  k8lh:minio_root_password:
    description: MinIO root password
    secret: true
  k8lh:postgres_admin_user:
    description: PostgreSQL admin username
  k8lh:postgres_admin_password:
    description: PostgreSQL admin password
    secret: true
  k8lh:airflow_postgres_user:
    description: PostgreSQL Airflow username
  k8lh:airflow_postgres_password:
    description: PostgreSQL Airflow password
    secret: true
  k8lh:polaris_postgres_user:
    description: PostgreSQL Polaris username
  k8lh:polaris_postgres_password:
    description: PostgreSQL Polaris password
    secret: true
